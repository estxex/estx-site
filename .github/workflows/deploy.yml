name: Deploy estx.exchange

on:
  push:
    branches:
      - main
      - staging

env:
  DEPLOY_HOST: 188.245.243.192
  DEPLOY_USER: deploy

jobs:
  deploy:
    name: rsync to Hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ env.DEPLOY_HOST }} ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBYgupgihWEc17UMG7HYySqfDIu/J2KG14rI7QVkL/gk" > ~/.ssh/known_hosts

      - name: Pick target directory
        id: target
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "dir=/var/www/estx.exchange" >> "$GITHUB_OUTPUT"
          else
            echo "dir=/var/www/stage.estx.exchange" >> "$GITHUB_OUTPUT"
          fi

      - name: rsync
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            --exclude='.git*' \
            --exclude='.github/' \
            --exclude='.htaccess' \
            --exclude='README.md' \
            --exclude='SETUP-GUIDE.md' \
            --exclude='build-legal.py' \
            --exclude='build-token.py' \
            --exclude='token-content.json' \
            --exclude='deploy/' \
            ./ "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ steps.target.outputs.dir }}/"
