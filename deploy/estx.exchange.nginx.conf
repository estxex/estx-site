# estx.exchange landing — static site served by nginx.
# Ported from the repo's .htaccess: HTTPS redirect, www -> apex, favicon alias,
# no-cache HTML, one-week cache for static assets.
# TLS blocks are added by certbot (--nginx) once DNS points at this server.

server {
    listen 80;
    listen [::]:80;
    server_name estx.exchange www.estx.exchange;

    root /var/www/estx.exchange;
    index index.html;

    # Canonical host: www -> apex (matches <link rel=canonical> in index.html)
    if ($host = www.estx.exchange) {
        return 301 https://estx.exchange$request_uri;
    }

    # Browsers request /favicon.ico directly; the icon lives in brand_assets
    location = /favicon.ico {
        alias /var/www/estx.exchange/brand_assets/favicon.png;
        add_header Cache-Control "public, max-age=604800";
    }

    # HTML revalidates every visit (304 when unchanged)
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Images/fonts cache for a week
    location ~* \.(png|jpg|jpeg|svg|webp|ico|woff|woff2)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # /privacy -> privacy.html etc. (clean URLs also work)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Never serve dotfiles (.htaccess, .git*)
    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/estx.exchange.access.log;
    error_log  /var/log/nginx/estx.exchange.error.log;
}
