# stage.estx.exchange — staging copy of the landing (deployed from the `staging` branch).
server {
    listen 80;
    listen [::]:80;
    server_name stage.estx.exchange;

    root /var/www/stage.estx.exchange;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /favicon.ico {
        alias /var/www/stage.estx.exchange/brand_assets/favicon.png;
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    location ~ /\. {
        deny all;
    }
}
