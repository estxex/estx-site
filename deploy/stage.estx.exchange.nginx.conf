# stage.estx.exchange — staging copy of the landing (deployed from the `staging` branch).
server {
    server_name stage.estx.exchange;

    root /var/www/stage.estx.exchange;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /favicon.ico {
        alias /var/www/stage.estx.exchange/brand_assets/favicon.png;
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        # repeated here: add_header in a location drops the server-level headers
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    location ~ /\. {
        deny all;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/estx.exchange/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/estx.exchange/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = stage.estx.exchange) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name stage.estx.exchange;
    return 404; # managed by Certbot


}